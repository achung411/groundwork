{% for item in attention['items'] %}
<article class="term"><p class="eyebrow">{{ item.property_name }}</p><h3>{{ item.title }}</h3><p>{{ item.detail }}</p><a href="{{ item.url }}">Review supporting records</a></article>
{% else %}<p class="notice">No attention items from approved records for this date. Missing records do not establish that all obligations have been satisfied.</p>{% endfor %}
